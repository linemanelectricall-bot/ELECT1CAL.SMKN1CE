<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Industrial Electrical Class</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>

:root{
    --bg:#0B0E14;
    --cyan:#00F2FF;
    --amber:#FFB800;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:#fff;
    font-family:'Space Mono', monospace;
    overflow-x:hidden;
}

/* ================= PRELOADER ================= */
#preloader{
    position:fixed;
    width:100%;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    flex-direction:column;
}

.loader-text{
    font-family:'Orbitron';
    font-size:2rem;
    color:var(--cyan);
    letter-spacing:5px;
    text-shadow:0 0 20px var(--cyan);
}

/* ================= HERO ================= */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1581092160607-ee22731c7e63') center/cover fixed;
    display:flex;
    align-items:center;
    justify-content:center;
}

.glass{
    backdrop-filter: blur(20px);
    background:rgba(255,255,255,0.05);
    padding:40px;
    border-radius:20px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.1);
}

.glass h1{
    font-family:'Orbitron';
    color:var(--cyan);
    text-shadow:0 0 20px var(--cyan);
}

/* ================= MEMBERS ================= */
.members{
    padding:80px 20px;
}

.title{
    text-align:center;
    font-family:'Orbitron';
    color:var(--amber);
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:25px;
}

.card{
    position:relative;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:15px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card img{
    width:100%;
    display:block;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px var(--cyan);
}

/* GLOW BORDER */
.card::before{
    content:'';
    position:absolute;
    inset:0;
    border:1px solid var(--cyan);
    opacity:0.3;
}

/* ================= GLITCH ================= */
.glitch{
    animation:glitch 0.2s;
}

@keyframes glitch{
    0%{transform:translate(2px,0);}
    50%{transform:translate(-2px,0);}
    100%{transform:translate(0,0);}
}

/* ================= CURSOR ================= */
.cursor{
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--cyan);
    position:fixed;
    pointer-events:none;
    box-shadow:0 0 20px var(--cyan);
    z-index:999;
}

</style>
</head>

<body>

<!-- PRELOADER -->
<div id="preloader">
    <div class="loader-text">INITIALIZING SYSTEM...</div>
</div>

<!-- CURSOR -->
<div class="cursor"></div>

<!-- HERO -->
<section class="hero">
    <div class="glass">
        <h1>INDUSTRIAL ELECTRICAL ENGINEERING</h1>
        <p>Professional Class • High Voltage Mindset ⚡</p>
    </div>
</section>

<!-- MEMBERS -->
<section class="members">
    <h2 class="title">ACTIVE CIRCUIT</h2>

    <div class="grid">

        <!-- WALI KELAS -->
        <div class="card">
            <img src="https://i.pravatar.cc/300?img=1">
        </div>

        <!-- ANGGOTA -->
        <div class="card"><img src="https://i.pravatar.cc/300?img=2"></div>
        <div class="card"><img src="https://i.pravatar.cc/300?img=3"></div>
        <div class="card"><img src="https://i.pravatar.cc/300?img=4"></div>
        <div class="card"><img src="https://i.pravatar.cc/300?img=5"></div>

    </div>
</section>

<canvas id="sparkCanvas"></canvas>

<script>

/* ================= PRELOADER ================= */
setTimeout(()=>{
    gsap.to("#preloader",{opacity:0,duration:1,onComplete:()=>{
        document.getElementById("preloader").style.display="none";
    }});
},3000);

/* ================= CURSOR ================= */
const cursor = document.querySelector('.cursor');

document.addEventListener('mousemove',e=>{
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
});

/* ================= SPARK EFFECT ================= */
const canvas = document.getElementById("sparkCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let sparks = [];

function createSpark(x,y){
    for(let i=0;i<20;i++){
        sparks.push({
            x:x,
            y:y,
            vx:(Math.random()-0.5)*5,
            vy:(Math.random()-0.5)*5,
            life:30
        });
    }
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    sparks.forEach((p,i)=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;

        ctx.beginPath();
        ctx.strokeStyle="rgba(0,242,255,0.8)";
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x+p.vx*2,p.y+p.vy*2);
        ctx.stroke();

        if(p.life<=0) sparks.splice(i,1);
    });

    requestAnimationFrame(animate);
}

animate();

/* ================= CLICK EFFECT ================= */
document.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click',e=>{
        let rect = card.getBoundingClientRect();
        createSpark(rect.left + rect.width/2, rect.top + rect.height/2);

        card.classList.add('glitch');
        setTimeout(()=>card.classList.remove('glitch'),200);
    });
});

</script>

</body>
</html>
